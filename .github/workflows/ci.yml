name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  NODE_VERSION: 24
  PNPM_VERSION: 11.15.1

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: bolt
          POSTGRES_PASSWORD: bolt
          POSTGRES_DB: trading_bolt_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bolt -d trading_bolt_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgres://bolt:bolt@localhost:5432/trading_bolt_test
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-only-jwt-secret-that-is-at-least-32-chars
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @trading-bolt/shared build

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build workspace
        run: pnpm build

      - name: Apply migrations
        run: pnpm db:migrate

      - name: Seed database
        run: pnpm db:seed

      - name: API e2e tests
        run: pnpm --filter api test:e2e
